<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #050507;
      color: white;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    .icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #00d4ff, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 900;
      color: black;
      box-shadow: 0 0 40px rgba(0,212,255,0.3);
    }
    h1 { font-size: 24px; font-weight: 700; letter-spacing: 0.2em; }
    p { color: rgba(255,255,255,0.4); font-size: 14px; text-align: center; max-width: 300px; }
    button {
      padding: 10px 24px;
      background: linear-gradient(135deg, #00d4ff, #a855f7);
      color: black;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { opacity: 0.9; transform: scale(1.02); }
  </style>
</head>
<body>
  <div class="icon">N</div>
  <h1>NEXUS</h1>
  <p>You're offline. Check your internet connection and try again.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
